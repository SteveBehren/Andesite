<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Andesite: the record they can't erase</title>
  <meta name="description" content="A permanent, open source ledger of documented and alleged violations of press freedom and civil liberties by the Indonesian state. Hash-sealed, four languages.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1117">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Andesite: the record they can't erase">
  <meta property="og:description" content="A permanent, open source ledger of documented and alleged violations of press freedom and civil liberties by the Indonesian state.">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' fill='%230d1117' stroke='%234c90f0' stroke-width='2'/%3E%3Cpath d='M9 23 16 9l7 14' fill='none' stroke='%23e6eaf0' stroke-width='2.5'/%3E%3Cpath d='M11.5 18h9' stroke='%23e6eaf0' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Runs before first paint: dark theme unless the visitor chose light,
    // and hide the first-visit notice if it was dismissed, so nothing jumps after load.
    (function () {
      var root = document.documentElement;
      try {
        root.setAttribute('data-theme', localStorage.getItem('andesite.theme') === 'light' ? 'light' : 'dark');
        if (localStorage.getItem('andesite.stripDismissed') === '1') root.classList.add('strip-off');
      } catch (e) {}
    })();
  </script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main" id="skip-link">Skip to content</a>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/overview" aria-label="Andesite">
      <svg class="brand-glyph" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="2" y="2" width="28" height="28" class="bg-stone"/>
        <path d="M9 24 16 8l7 16" class="bg-cut"/>
        <path d="M11.6 18.5h8.8" class="bg-cut"/>
      </svg>
      <span class="brand-text"><span class="brand-name">Andesite</span><span class="brand-sub" id="brand-sub">Civil liberties ledger</span></span>
    </a>
    <nav class="tb-nav" id="tb-nav" aria-label="Primary"></nav>
    <div class="tb-right">
      <button type="button" class="tb-btn tb-search" id="open-search" aria-haspopup="dialog">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.4 10.4 3.6 3.6"/></svg>
        <span class="lbl" id="search-label">Search</span><kbd id="search-kbd">/</kbd>
      </button>
      <span class="live" id="live" data-tip=""><span class="live-dot" aria-hidden="true"></span><span class="lbl" id="live-label">Live</span></span>
      <div class="seal-wrap">
        <button type="button" class="seal-badge" id="seal-badge" aria-expanded="false" aria-controls="seal-panel" data-state="pending">
          <svg class="seal-icon" viewBox="0 0 16 16" aria-hidden="true"><path class="s-shield" d="M8 1.8 13 4v4c0 3-2.2 5.2-5 6.2C5.2 13.2 3 11 3 8V4z"/><path class="i-ok" d="m5.6 8 1.7 1.7 3.2-3.4"/><path class="i-bad" d="M6 6l4 4M10 6l-4 4"/></svg>
          <span class="seal-text" id="seal-text">Verifying</span><span class="visually-hidden" id="seal-sr"></span>
        </button>
        <div class="seal-panel popover" id="seal-panel" hidden>
          <p id="seal-explain"></p>
          <p class="mono-label" id="seal-head-label">Final hash</p>
          <code class="hash" id="seal-hash"></code>
          <div class="row-gap">
            <button type="button" class="btn btn-small" id="seal-copy">Copy hash</button>
            <a class="btn btn-small btn-quiet" href="#/integrity" id="seal-more">Open integrity view</a>
          </div>
        </div>
      </div>
      <div class="lang-wrap">
        <button type="button" class="tb-btn tb-lang" id="lang-btn" aria-expanded="false" aria-controls="lang-pop">
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2.6 4 2.6 6S10 12 8 14C6 12 5.4 10 5.4 8S6 4 8 2z"/></svg>
          <span class="lbl" id="lang-current">EN</span>
        </button>
        <ul class="popover lang-pop" id="lang-pop" hidden></ul>
      </div>
      <button type="button" class="tb-btn icon-only theme-toggle" id="theme-toggle" aria-label="Switch to light mode">
        <svg class="ico i-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>
        <svg class="ico i-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.8 10.4A5.4 5.4 0 0 1 5.6 3.2a5.4 5.4 0 1 0 7.2 7.2z"/></svg>
      </button>
      <button type="button" class="tb-btn icon-only menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menu-panel" aria-label="Menu">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
      </button>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>

  <div class="subbar" id="subbar"></div>
  <div class="banner-broken" id="seal-banner" role="alert" hidden></div>

  <main id="main" class="view" tabindex="-1">
    <noscript><p class="noscript">Andesite needs JavaScript to verify the seal and show the ledger. The raw data is in <a href="data/entries.json">data/entries.json</a>.</p></noscript>
    <div class="boot" id="boot" aria-live="polite">
      <div class="boot-grid" aria-hidden="true"></div>
      <p class="boot-text mono" id="boot-text">Loading ledger</p>
    </div>
  </main>

  <footer class="statusbar" id="statusbar">
    <span class="sb-item" id="footer-notcourt"></span>
    <span class="sb-item"><span id="footer-last-label"></span> <span class="mono" id="footer-last"></span></span>
    <span class="sb-item sb-hash"><span id="footer-head-label"></span> <code class="hash" id="footer-head"></code></span>
    <span class="sb-item" id="footer-licences"></span>
    <span class="sb-item"><a href="https://github.com/SteveBehren/Andesite" rel="noopener" id="footer-repo"></a> · <a href="https://github.com/SteveBehren" rel="noopener" id="footer-built"></a></span>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>

  <div class="scrim" id="menu-scrim" hidden></div>
  <aside class="drawer" id="menu-panel" aria-label="Menu" aria-modal="true" role="dialog" hidden>
    <div class="drawer-head">
      <span class="drawer-title" id="menu-title">Menu</span>
      <button type="button" class="tb-btn icon-only" id="menu-close" aria-label="Close menu">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="menu-body"></div>
  </aside>

  <div class="scrim" id="palette-scrim" hidden></div>
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-labelledby="palette-input" hidden>
    <div class="pal-input">
      <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.4 10.4 3.6 3.6"/></svg>
      <input type="search" id="palette-input" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list">
      <kbd>Esc</kbd>
    </div>
    <ul class="pal-list" id="palette-list" role="listbox"></ul>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
