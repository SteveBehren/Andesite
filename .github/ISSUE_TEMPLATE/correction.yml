name: Correction
description: Report an error in an existing entry. Corrections are published as visible amendments; nothing is deleted.
title: "[Correction] AND-"
labels: ["correction"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry ID
      placeholder: AND-0012
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links that support the correction.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - Factual correction
        - Evidence level should change
        - Additional sources
        - The entry should be withdrawn
        - A linked social post has been deleted
    validations:
      required: true
